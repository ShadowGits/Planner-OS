# Google Cloud Build — automatically builds and deploys the FastAPI backend
# to Cloud Run on every push to the `main` branch.
#
# Setup (one-time):
#   gcloud builds triggers create github \
#     --repo-name=Planner-OS \
#     --repo-owner=ShadowGits \
#     --branch-pattern=^main$ \
#     --build-config=cloudbuild.yaml \
#     --name=planner-os-api-deploy

steps:
  # Step 0: Pull the latest image so we can use it as a cache (allow failure if it doesn't exist yet)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull gcr.io/$PROJECT_ID/planner-os-api:latest || exit 0']

  # Step 1: Build the Docker image using the cache
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/planner-os-api:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/planner-os-api:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/planner-os-api:latest'
      - '.'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/planner-os-api'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'planner-os-api'
      - '--image=gcr.io/$PROJECT_ID/planner-os-api:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300'
      - '--concurrency=80'
      # Give the container extra CPU during startup so cold starts boot faster.
      # No extra charge — startup CPU boost is included at the same price.
      - '--cpu-boost'
      # Stamp the running service with the commit it was built from.
      #
      # This trigger reports nothing back to GitHub, so from outside there was
      # no way to tell a push that landed on main from a push that actually
      # reached production. During an outage that is the first question worth
      # asking and the one we could not answer. /api/health now returns it.
      #
      # update-env-vars, never set-env-vars: set replaces the whole environment
      # and would wipe every secret this service runs on.
      - '--update-env-vars=BUILD_SHA=$SHORT_SHA,BUILD_ID=$BUILD_ID'
      # Refuse to route traffic to a revision whose app did not start.
      #
      # Cloud Run otherwise only checks that something is listening on $PORT.
      # When create_app() fails it still serves a stub, which listens — so a
      # broken build was marked healthy and took 100% of traffic, and every
      # route answered "Not Found" until someone noticed. The stub answers 503
      # here, so this probe fails, the revision is rejected, and the previous
      # good one keeps serving. Costs nothing and changes no scaling setting.
      - '--startup-probe=httpGet.path=/api/health,initialDelaySeconds=5,periodSeconds=5,timeoutSeconds=4,failureThreshold=6'
      # Keep checking after startup, and replace a container that stops
      # answering.
      #
      # The startup probe only runs while a container is being born. Once it
      # was alive nothing checked it again, so when every worker thread in one
      # container ended up stuck, that container stayed in service answering
      # nothing at all: /api/health does no work whatsoever and still timed out
      # at the 300s request limit, because a synchronous route cannot run
      # without a thread. It sat there until someone noticed by hand.
      #
      # This asks whether the process is alive, and nothing more. The first
      # version of it tried to catch a starved threadpool too, by keeping
      # /api/health synchronous so it would fail when no thread was free. That
      # killed working containers: a calendar sync holds threads for about two
      # minutes, which was enough to miss three checks and have the instance
      # shut down in the middle of the sync. Busy is not dead. /api/health is
      # async now, so this fails only when the event loop has stopped, and
      # thread exhaustion is prevented at its source instead — see the timeout
      # on the push calls that used to leak threads.
      #
      # Generous with it either way: five minutes before replacing a container,
      # because the cost of being wrong is killing live work, while a genuinely
      # dead one costs only the wait.
      #
      # Free, and it changes no scaling setting. Probes only run against a
      # container that already exists, so a service asleep at min-instances=0
      # has nothing to probe, and health checks are not billed as requests.
      - '--liveness-probe=httpGet.path=/api/health,periodSeconds=60,timeoutSeconds=10,failureThreshold=5'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/planner-os-api'
