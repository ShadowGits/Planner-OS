<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Day</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Day">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-180.png">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <div id="key-gate" class="key-gate hidden">
    <div class="key-card">
      <div class="key-icon">🔒</div>
      <h1>Day Planner</h1>
      <p>Enter your access key once. It stays on this device.</p>
      <input id="key-input" type="password" placeholder="Access key" autocomplete="off">
      <button id="key-save">Unlock</button>
      <p id="key-error" class="key-error hidden">That key was rejected. Try again.</p>
    </div>
  </div>

  <header class="top">
    <div class="top-row">
      <h1 id="day-title">Today <span class="chev">›</span></h1>
      <span id="day-count" class="day-count"></span>
    </div>
    <div class="week-row">
      <button id="week-prev" class="week-nav" aria-label="Previous week">‹</button>
      <div id="week-strip" class="week-strip"></div>
      <button id="week-next" class="week-nav" aria-label="Next week">›</button>
    </div>
  </header>

  <main>
    <section id="inbox" class="inbox hidden">
      <div id="inbox-list" class="inbox-list"></div>
    </section>
    <section id="timeline" class="timeline">
      <div id="list"></div>
      <div id="empty" class="empty hidden">
        <div class="empty-emoji">🌤️</div>
        <p>Nothing planned yet.</p>
        <p class="empty-sub">Tap + to add your first task.</p>
      </div>
    </section>
  </main>

  <button id="unsched-pill" class="unsched-pill hidden" aria-label="Jump to unscheduled tasks"></button>

  <button id="fab" class="fab" aria-label="Add task">+</button>

  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <div id="sheet" class="sheet hidden">
    <div class="sheet-handle"></div>
    <h2 id="sheet-title">New task</h2>
    <input id="new-title" type="text" placeholder="What are you doing?" autocomplete="off">
    <div class="sheet-row">
      <label class="sheet-label">Date
        <input id="new-date" type="date">
      </label>
      <label class="sheet-label">Start
        <input id="new-time" type="time">
      </label>
      <label class="sheet-label">Length
        <div class="dur-wrapper" style="display:flex; flex-direction:column; gap:12px;">
          <div id="dur-chips" class="chips">
            <button data-min="15">15m</button>
            <button data-min="30" class="on">30m</button>
            <button data-min="45">45m</button>
            <button data-min="60">1h</button>
            <button data-min="90">1.5h</button>
            <button data-min="120">2h</button>
          </div>
          <div style="display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-2);">
            <span>Custom (min):</span>
            <input id="custom-dur" type="number" min="5" step="5" placeholder="e.g. 180" style="width:80px; padding:6px 8px; border-radius:8px; border:1px solid var(--line); font-size:14px; background:var(--chip); color:var(--ink);" />
          </div>
        </div>
      </label>
    </div>
    <button id="sheet-save" class="sheet-save">Add to day</button>
    <div style="display:flex; gap:8px;">
      <button id="sheet-split" class="sheet-delete hidden" style="flex:1; background:var(--bg-2); color:var(--ink); border:1px solid var(--line);">Split Block</button>
      <button id="sheet-delete" class="sheet-delete hidden" style="flex:1;">Delete task</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js?v=10"></script>
</body>
</html>
