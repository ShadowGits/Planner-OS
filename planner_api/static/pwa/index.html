<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Day</title>
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Day">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="key-gate" class="key-gate hidden">
    <div class="key-card">
      <div class="key-icon">🔒</div>
      <h1>Day Planner</h1>
      <p>Enter your access key once. It stays on this device.</p>
      <input id="key-input" type="password" placeholder="Access key" autocomplete="off">
      <button id="key-save">Unlock</button>
      <p id="key-error" class="key-error hidden">That key was rejected. Try again.</p>
    </div>
  </div>

  <header class="top">
    <div class="top-row">
      <div>
        <h1 id="day-title">Today</h1>
        <p id="day-subtitle" class="subtitle"></p>
      </div>
      <div class="ring-wrap" title="Done today">
        <svg id="ring" viewBox="0 0 44 44" width="44" height="44">
          <circle class="ring-bg" cx="22" cy="22" r="19"></circle>
          <circle id="ring-fg" class="ring-fg" cx="22" cy="22" r="19"></circle>
        </svg>
        <span id="ring-label" class="ring-label">0/0</span>
      </div>
    </div>
    <div class="week-row">
      <button id="week-prev" class="week-nav" aria-label="Previous week">‹</button>
      <div id="week-strip" class="week-strip"></div>
      <button id="week-next" class="week-nav" aria-label="Next week">›</button>
    </div>
  </header>

  <main>
    <section id="inbox" class="inbox hidden">
      <h2 class="inbox-title">Inbox</h2>
      <div id="inbox-list" class="inbox-list"></div>
    </section>
    <section id="timeline" class="timeline">
      <div id="grid"></div>
      <div id="empty" class="empty hidden">
        <div class="empty-emoji">🌤️</div>
        <p>Nothing planned yet.</p>
        <p class="empty-sub">Tap + to add your first task.</p>
      </div>
    </section>
  </main>

  <button id="fab" class="fab" aria-label="Add task">+</button>

  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <div id="sheet" class="sheet hidden">
    <div class="sheet-handle"></div>
    <h2>New task</h2>
    <input id="new-title" type="text" placeholder="What are you doing?" autocomplete="off">
    <div class="sheet-row">
      <label class="sheet-label">Start
        <input id="new-time" type="time">
      </label>
      <label class="sheet-label">Length
        <div id="dur-chips" class="chips">
          <button data-min="15">15m</button>
          <button data-min="30" class="on">30m</button>
          <button data-min="45">45m</button>
          <button data-min="60">1h</button>
          <button data-min="90">1.5h</button>
        </div>
      </label>
    </div>
    <button id="sheet-save" class="sheet-save">Add to day</button>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
